<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Complaint System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            🏛️ Smart Service Portal
        </a>
    </nav>

    <div class="auth-container">
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p>Sign in to your complaint management account</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="name@domain.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Sign In
            </button>
        </form>

        <p style="text-align: center; margin-top: 1.25rem; font-size: 0.9rem; color: var(--text-secondary);">
            Don't have an account? <a href="register.html" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Register here</a>
        </p>

        <!-- Quick Demo Credentials Box for Interview Demonstration -->
        <div class="demo-box">
            <div class="demo-title">🔑 Quick Demo Credentials (Interview Test)</div>
            <div class="demo-btns">
                <button type="button" class="btn btn-sm btn-secondary" onclick="quickFill('student@service.com', 'student123')">
                    Student Login
                </button>
                <button type="button" class="btn btn-sm btn-secondary" onclick="quickFill('admin@service.com', 'admin123')">
                    Admin Login
                </button>
            </div>
        </div>
    </div>

    <footer>
        Smart Complaint Management System &copy; 2026
    </footer>

    <script src="js/auth.js"></script>
</body>
</html>
